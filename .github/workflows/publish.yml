name: Publish to npm

# n8n requires verified community nodes to be published by CI with a provenance
# statement, not from a maintainer's laptop. Tag a release and this does it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # provenance signing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Build is tsc only; skipping install scripts avoids compiling native dev dependencies (isolated-vm).
      - run: npm install --no-audit --no-fund --ignore-scripts

      - name: Check the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package version $PKG"
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/v')

      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
